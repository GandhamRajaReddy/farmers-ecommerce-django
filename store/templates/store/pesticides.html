{% include 'store/navbar.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pesticides - AgriMart</title>

<style>
/* GLOBAL */
body {
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#f5f7f2;
    overflow-x:hidden;
}

/* PAGE TITLE */
.page-header {
    text-align:center;
    padding:30px 10px 10px;
}
.page-header h1 {
    font-size:34px;
    font-weight:800;
    color:#2e7d32;
}
.page-header p {
    margin-top:5px;
    color:#555;
}

/* GRID */
.category-grid {
    width:95%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    padding:20px 0 50px;
}

/* CATEGORY CARD */
.category-card {
    background:white;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.12);
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}
.category-card:hover {
    transform:translateY(-8px);
}
.category-card img {
    width:100%;
    height:170px;
    object-fit:cover;
}
.category-card h3 {
    text-align:center;
    padding:14px;
    font-size:20px;
    font-weight:700;
    color:#333;
}

/* RESPONSIVE */
@media(max-width:900px){
    .category-grid { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:600px){
    .category-grid { grid-template-columns:1fr; }
    .page-header h1 { font-size:28px; }
}
</style>
</head>

<body>

<!-- PAGE TITLE -->
<div class="page-header">
    <h1>Pesticides Categories</h1>
    <p>Select the right pesticide type for your farming needs</p>
</div>

<!-- CATEGORY GRID -->
<div class="category-grid">

    <!-- Insecticides -->
    <a href="{% url 'insecticides' %}">
        <div class="category-card">
            <img src="/static/images/pesticides/insecticide.jpg">
            <h3>Insecticides</h3>
        </div>
    </a>

    <!-- Herbicides -->
    <a href="{% url 'herbicides' %}">
        <div class="category-card">
            <img src="/static/images/pesticides/herbicide.jpg">
            <h3>Herbicides</h3>
        </div>
    </a>

    <!-- Fungicides -->
    <a href="{% url 'fungicides' %}">
        <div class="category-card">
            <img src="/static/images/pesticides/fungicide.jpg">
            <h3>Fungicides</h3>
        </div>
    </a>

    <!-- Rodenticides -->
    <a href="{% url 'rodenticides' %}">
        <div class="category-card">
            <img src="/static/images/pesticides/rodenticide.jpg">
            <h3>Rodenticides</h3>
        </div>
    </a>

    <!-- Bactericides -->
    <a href="{% url 'bactericides' %}">
        <div class="category-card">
            <img src="/static/images/pesticides/bactericide.jpg">
            <h3>Bactericides</h3>
        </div>
    </a>

    <!-- Nematicides -->
    <a href="{% url 'nematicides' %}">
        <div class="category-card">
            <img src="/static/images/pesticides/nematicide.jpg">
            <h3>Nematicides</h3>
        </div>
    </a>

</div>
<script src="{% static 'js/cart.js' %}"></script>

</body>
</html>
