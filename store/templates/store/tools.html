{% load static %}
{% include 'store/navbar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farming Tools - AgriMart</title>

<style>
/* GLOBAL */
body {
    margin:0;
    padding:0;
    background:#f5f7f2;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* PAGE TITLE */
.category-title {
    text-align:center;
    margin:30px 0;
    font-size:32px;
    font-weight:700;
    color:#2e7d32;
}

/* GRID SYSTEM — 3 per row */
.tools-grid {
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:25px;
}

/* CARDS */
.tool-card {
    background:white;
    padding:16px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
    transition:0.3s;
}
.tool-card:hover {
    transform:translateY(-6px);
}
.tool-card img {
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}
.tool-card h3 {
    margin-top:12px;
    font-size:20px;
    font-weight:700;
    color:#2e7d32;
}

/* RESPONSIVE — TABLET */
@media (max-width:900px) {
    .tools-grid {
        grid-template-columns:repeat(2, 1fr);
    }
}

/* RESPONSIVE — MOBILE */
@media (max-width:600px) {
    .tools-grid {
        grid-template-columns:1fr;
        width:95%;
    }
}
</style>
</head>

<body>

<h2 class="category-title">Farming Tools</h2>

<!-- <div class="tools-grid">

    <div class="tool-card">
        <img src="/static/images/tools/hoe.jpg">
        <h3>Hoe</h3>
    </div>

    <div class="tool-card">
        <img src="/static/images/tools/shovel.jpg">
        <h3>Shovel</h3>
    </div>

    <div class="tool-card">
        <img src="/static/images/tools/rake.jpg">
        <h3>Rake</h3>
    </div>

</div> -->
<div class="products-grid">
     {% for p in products %}
    <div class="product-card">
        <img src="{{ p.image.url }}">
        <h3>{{ p.name }}</h3>
        <p>{{ p.description }}</p>
        <button class="add-to-cart">Add to Cart</button>
    </div>
    {% empty %}
    <p style="text-align:center;">No products available.</p>
    {% endfor %}
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    function readCart() {
        try {
            return JSON.parse(localStorage.getItem('cart')) || [];
        } catch (e) {
            return [];
        }
    }
    function writeCart(cart) {
        localStorage.setItem('cart', JSON.stringify(cart));
        // notify navbar and cart page
        window.dispatchEvent(new Event('cart-updated'));
    }
    // Delegated handler for Add to Cart buttons
    document.body.addEventListener('click', function (e) {
        const btn = e.target.closest('button.add-to-cart');
        if (!btn) return;

        const id = btn.dataset.id || btn.closest('.product-card')?.dataset.id || String(Date.now());
        const name = btn.dataset.name || btn.closest('.product-card')?.dataset.name || 'Product';
        const price = parseFloat(btn.dataset.price || btn.closest('.product-card')?.dataset.price || 0) || 0;

        const cart = readCart();
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty = (item.qty || 1) + 1;
        } else {
            cart.push({ id, name, price, qty: 1 });
        }
        writeCart(cart);
        // quick feedback
        const original = btn.textContent;
        btn.textContent = 'Added ✓';
        btn.disabled = true;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 800);
    });
});
</script>

</body>
</html>
