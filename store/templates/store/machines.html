{% load static %}
{% include 'store/navbar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agricultural Machines - AgriMart</title>

<style>
body {
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#f5f7f2;
    overflow-x:hidden;
}

/* HEADER */
.page-header {
    text-align:center;
    padding:30px 0 10px;
}
.page-header h1 {
    font-size:34px;
    font-weight:800;
    color:#2e7d32;
}
.page-header p {
    font-size:16px;
    color:#555;
}

/* GRID */
.products-grid {
    width:90%;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:25px;
}

/* CARD */
.machine-card {
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
    transition:0.3s;
}
.machine-card:hover {
    transform:translateY(-6px);
}

/* 🔥 FIX: PERFECT IMAGE AUTO-RESIZING */
.machine-card img {
    width:100%;
    height:200px;
    object-fit:contain;   /* show full original image */
    object-position:center;
    border-radius:10px;
    background:white;
     
    display:block;
}


/* RESPONSIVE */
@media (max-width:900px) {
    .products-grid {
        grid-template-columns:repeat(2,1fr);
    }
}
@media (max-width:600px) {
    .products-grid {
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<div class="page-header">
    <h1>Agricultural Machines</h1>
    <p>Modern machines to improve your farming efficiency.</p>
</div>

<div class="products-grid">

    <!-- <div class="machine-card">
        <img src="/static/images/machines/download.jpeg">
        <h3>Tractor</h3>
    </div>

    <div class="machine-card">
        <img src="/static/images/machines/powersprayer.avif">
        <h3>Power Sprayer</h3>
    </div>

    <div class="machine-card">
        <img src="/static/images/machines/dronesprayer.jpg">
        <h3>Drone Sprayer</h3>
    </div>

    <div class="machine-card">
        <img src="/static/images/machines/harvester.webp">
        <h3>Harvester Machine</h3>
    </div>

    <div class="machine-card">
        <img src="/static/images/machines/cultivator.jpeg">
        <h3>Cultivator</h3>
    </div>

    <div class="machine-card">
        <img src="/static/images/machines/plough.jpeg">
        <h3>Plough Machine</h3>
    </div> -->
    {% for p in products %}
    <div class="product-card">
        <img src="{{ p.image.url }}">
        <h3>{{ p.name }}</h3>
        <p>{{ p.description }}</p>
        <button class="add-to-cart">Add to Cart</button>
    </div>
    {% empty %}
    <p style="text-align:center;">No products available.</p>
    {% endfor %}

</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    function readCart() {
        try {
            return JSON.parse(localStorage.getItem('cart')) || [];
        } catch (e) {
            return [];
        }
    }
    function writeCart(cart) {
        localStorage.setItem('cart', JSON.stringify(cart));
        // notify navbar and cart page
        window.dispatchEvent(new Event('cart-updated'));
    }
    // Delegated handler for Add to Cart buttons
    document.body.addEventListener('click', function (e) {
        const btn = e.target.closest('button.add-to-cart');
        if (!btn) return;

        const id = btn.dataset.id || btn.closest('.product-card')?.dataset.id || String(Date.now());
        const name = btn.dataset.name || btn.closest('.product-card')?.dataset.name || 'Product';
        const price = parseFloat(btn.dataset.price || btn.closest('.product-card')?.dataset.price || 0) || 0;

        const cart = readCart();
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty = (item.qty || 1) + 1;
        } else {
            cart.push({ id, name, price, qty: 1 });
        }
        writeCart(cart);
        // quick feedback
        const original = btn.textContent;
        btn.textContent = 'Added ✓';
        btn.disabled = true;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 800);
    });
});
</script>

</body>
</html>
