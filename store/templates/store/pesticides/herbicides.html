{% include 'store/navbar.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Herbicides - AgriMart</title>

<style>
body {
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#f5f7f2;
    overflow-x:hidden;
}

/* PAGE HEADER */
.page-header {
    text-align:center;
    padding:30px 10px 10px;
}
.page-header h1 {
    font-size:34px;
    font-weight:800;
    color:#2e7d32;
}
.page-header p {
    margin-top:5px;
    color:#555;
}

/* GRID */
.products-grid {
    width:95%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:25px;
    padding:20px 0 60px;
}

/* PRODUCT CARD */
.product-card {
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
    transition:0.3s;
}
.product-card:hover {
    transform:translateY(-6px);
}
.product-card img {
    display: block;
    margin: auto; /* centers image */
    max-width: 100%;
    max-height: 260px;
    object-fit: contain;
    background-color: #fff;
    border-radius: 12px;
    padding: 10px;
}
.product-card h3 {
    margin:12px 0 5px;
    font-size:20px;
    font-weight:700;
    color:#333;
}
.product-card p {
    color:#555;
    font-size:14px;
    margin-bottom:12px;
}
.product-card button {
    width:100%;
    padding:10px;
    border:none;
    background:#2e7d32;
    color:white;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
}
.product-card button:hover {
    background:#256528;
}

/* RESPONSIVE */
@media(max-width:900px){
    .products-grid { grid-template-columns:repeat(2, 1fr); }
}
@media(max-width:600px){
    .products-grid { grid-template-columns:1fr; width:90%; }
}
</style>
</head>

<body>

<!-- PAGE TITLE -->
<div class="page-header">
    <h1>Herbicides</h1>
    <p>Remove weeds & unwanted plants for maximum crop growth.</p>
</div>

<!-- PRODUCTS GRID -->
<div class="products-grid">

    {% for p in products %}
    <div class="product-card">
        <img src="{{ p.image.url }}">
        <h3>{{ p.name }}</h3>
        <p>{{ p.description }}</p>
        <button class="add-to-cart">Add to Cart</button>
    </div>
    {% empty %}
    <p style="text-align:center;">No products available.</p>
    {% endfor %}

</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    function readCart() {
        try {
            return JSON.parse(localStorage.getItem('cart')) || [];
        } catch (e) {
            return [];
        }
    }
    function writeCart(cart) {
        localStorage.setItem('cart', JSON.stringify(cart));
        // notify navbar and cart page
        window.dispatchEvent(new Event('cart-updated'));
    }
    // Delegated handler for Add to Cart buttons
    document.body.addEventListener('click', function (e) {
        const btn = e.target.closest('button.add-to-cart');
        if (!btn) return;

        const id = btn.dataset.id || btn.closest('.product-card')?.dataset.id || String(Date.now());
        const name = btn.dataset.name || btn.closest('.product-card')?.dataset.name || 'Product';
        const price = parseFloat(btn.dataset.price || btn.closest('.product-card')?.dataset.price || 0) || 0;

        const cart = readCart();
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty = (item.qty || 1) + 1;
        } else {
            cart.push({ id, name, price, qty: 1 });
        }
        writeCart(cart);
        // quick feedback
        const original = btn.textContent;
        btn.textContent = 'Added ✓';
        btn.disabled = true;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 800);
    });
});
</script>

</body>
</html>
