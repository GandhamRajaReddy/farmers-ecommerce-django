{% extends "store/base.html" %}
{% load static %}

{% block content %}

<style>
    body {
        background: #f4fff4;
        font-family: sans-serif;
    }

    .otp-container {
        width: 420px;
        margin: 50px auto;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .otp-title {
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        color: #2e7d32;
        margin-bottom: 10px;
    }

    .otp-subtitle {
        text-align: center;
        margin-bottom: 20px;
        color: #555;
        font-size: 15px;
    }

    .otp-boxes {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 25px 0;
    }

    .otp-boxes input {
        width: 55px;
        height: 55px;
        font-size: 22px;
        text-align: center;
        border: 2px solid #ddd;
        border-radius: 10px;
        outline: none;
        transition: 0.3s;
    }

    .otp-boxes input:focus {
        border-color: #2e7d32;
    }

    .verify-btn {
        width: 100%;
        padding: 12px;
        background: #2e7d32;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 15px;
    }

    .verify-btn:hover {
        background: #256528;
    }

    .resend {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }

    .resend a {
        color: #2e7d32;
        font-weight: 600;
        text-decoration: none;
    }

    @media (max-width: 480px) {
        .otp-container {
            width: 90%;
            padding: 25px;
        }

        .otp-boxes input {
            width: 45px;
            height: 45px;
        }
    }
</style>

<div class="otp-container">

    <h2 class="otp-title">Verify OTP</h2>
    <p class="otp-subtitle">Enter the 6-digit code sent to your email/phone.</p>

    <form method="POST">
        {% csrf_token %}

        <div class="otp-boxes">
            <input type="text" maxlength="1" name="d1" required>
            <input type="text" maxlength="1" name="d2" required>
            <input type="text" maxlength="1" name="d3" required>
            <input type="text" maxlength="1" name="d4" required>
            <input type="text" maxlength="1" name="d5" required>
            <input type="text" maxlength="1" name="d6" required>
        </div>

        <button type="submit" class="verify-btn">Verify OTP</button>
    </form>

    <div class="resend">
        Didn’t receive the code?  
        <a href="#">Resend OTP</a>
    </div>

</div>

<script>
    const inputs = document.querySelectorAll(".otp-boxes input");
    inputs.forEach((input, index) => {
        input.addEventListener("keyup", () => {
            if (input.value.length === 1 && index < 5) {
                inputs[index + 1].focus();
            }
        });
    });
</script>

{% endblock %}
